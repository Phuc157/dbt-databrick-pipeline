name: analytics

profile: databricks

clean-targets:          # ditectories to be removed by `dbt clean`
  - "target"
  - "dbt_package"

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/confuguring-models

# In this example config, we rell dbt to build all models in the example/
# directory as views. These settings can be overidden in the individual
# files using the `{{ config(...)}}` macro

models:
  analytics:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts